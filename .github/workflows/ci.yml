name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'

  # 배포 서버(Oracle E2.1.Micro, RAM 1GB)에서 직접 이미지를 빌드하면 다른 컨테이너들과
  # 메모리를 나눠 쓰는 상태에서 Gradle 빌드가 스왑까지 밀려 들어가 사실상 멈춰버리는
  # 문제가 있었음. 빌드는 러너에서 하고 배포 서버는 완성된 이미지를 pull만 하도록 분리.
  # main에 push된 경우에만 실행(PR에서는 빌드/푸시 안 함).
  build-and-push-images:
    name: Build & Push Docker Images
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, auth-service, festival-service, reservation-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build jar
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.service }}:bootJar -x test --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: ghcr.io/likelion-backend-24th/final-project-team5-${{ matrix.service }}:latest
