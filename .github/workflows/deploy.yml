name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["deploy"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/Final-Project-Team5
            git fetch origin
            git checkout deploy
            git pull --ff-only origin deploy
            docker compose -f docker-compose.yml -f docker-compose.small.yml pull gateway auth-service festival-service reservation-service frontend
            docker compose -f docker-compose.yml -f docker-compose.small.yml up -d
            # nginx는 설정 파일이 bind mount라 내용이 바뀌어도, 이미지도 안 바뀌므로
            # Compose가 재생성 대상으로 인식하지 못한다. 컨테이너를 통째로 재생성하는
            # 대신 reload 시그널만 보내 최신 nginx.conf를 반영한다. reload는 새 워커
            # 프로세스를 띄우는 과정에서 업스트림 호스트명도 다시 조회하므로, 방금 위에서
            # 재생성된 백엔드 컨테이너들의 바뀐 내부 IP에 대한 DNS 캐시 갱신도 함께 된다.
            docker exec nginx nginx -s reload
