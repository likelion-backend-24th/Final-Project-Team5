name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["deploy"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/Final-Project-Team5
            git fetch origin
            git checkout deploy
            git pull --ff-only origin deploy
            docker compose -f docker-compose.yml -f docker-compose.small.yml pull gateway auth-service festival-service reservation-service payment-service frontend
            docker compose -f docker-compose.yml -f docker-compose.small.yml up -d
            # nginx는 설정 파일이 bind mount라 내용이 바뀌어도, 이미지도 안 바뀌므로
            # Compose가 재생성 대상으로 인식하지 못한다. 컨테이너를 통째로 재생성하는
            # 대신 reload 시그널만 보내 최신 nginx.conf를 반영한다. reload는 새 워커
            # 프로세스를 띄우는 과정에서 업스트림 호스트명도 다시 조회하므로, 방금 위에서
            # 재생성된 백엔드 컨테이너들의 바뀐 내부 IP에 대한 DNS 캐시 갱신도 함께 된다.
            docker exec nginx nginx -s reload
            # 배포마다 새 :latest 이미지가 pull되면서 이전 이미지가 태그 없는 레이어로 남아
            # 쌓인다(2026-09-16 확인 시 이미지 205개·16GB, 실제 사용은 8개·2.3GB). 방치하면
            # 디스크가 차서 다음 pull이 실패하므로, up -d로 새 컨테이너가 다 뜬 뒤 실행 중인
            # 컨테이너가 쓰지 않는 이미지와 빌드 캐시를 지운다. 실행 중 이미지는 prune 대상이
            # 아니라 롤백은 GHCR에서 이전 태그를 다시 pull하는 방식으로만 가능하다.
            docker image prune -af
            docker builder prune -af
