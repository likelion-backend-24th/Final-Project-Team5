server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:3307}/${AUTH_DB_NAME:auth_db}
    username: ${AUTH_DB_USERNAME:auth_user}
    password: ${AUTH_DB_PASSWORD:auth_password}
    hikari:
      # 기본값(10)대로면 서비스 4개만으로 MySQL max_connections를 다 써버린다 — 4개 서비스가
      # 각자 여유를 갖도록 5로 낮춘다(2026-09-08, payment-service 도입 후 커넥션 고갈 장애).
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_APP_PASSWORD:dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

#로그 설정
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org:
      springframework:
        security: trace


jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-please-change-before-deploy}
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일


kakao:
  client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
  client-secret: ${KAKAO_CLIENT_SECRET:dummy-client-secret}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}

google:
  client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

# Festival-Service -> Auth-Service 내부 호출(PUT /internal/v1/roles, /internal/v1/helper-accounts) 인증 토큰.
# festival-service의 INTERNAL_AUTH_TOKEN과 반드시 같은 값이어야 한다.
internal:
  role-grant:
    token: ${INTERNAL_AUTH_TOKEN:CHANGE_ME_IN_ENV}

# 도우미(HELPER) 계정 자동 회수 정책 — 페스티벌 종료(endAt) 후 이 시간이 지나면 배치가 자동 탈퇴 처리한다.
helper:
  account:
    revoke-after-hours: ${HELPER_ACCOUNT_REVOKE_AFTER_HOURS:24}

# 호스트가 입력한 페스티벌 시각(타임존 없는 벽시계)을 "지금"과 비교할 때 쓰는 기준 타임존.
# 컨테이너 TZ 설정에 의존하지 않도록 명시한다 — 팀원 로컬·CI 등 TZ가 다른 환경에서도 같게 동작해야 한다.
app:
  timezone: ${APP_TIMEZONE:Asia/Seoul}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
