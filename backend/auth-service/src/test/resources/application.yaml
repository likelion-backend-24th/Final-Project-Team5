spring:
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_APP_PASSWORD:dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: test-jwt-secret-key-for-acceptance-tests-must-be-at-least-256-bits-long
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000
