spring:
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-jwt-secret-key-for-acceptance-tests-must-be-at-least-256-bits-long
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000
