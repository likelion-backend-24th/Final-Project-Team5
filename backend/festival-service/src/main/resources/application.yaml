server:
  port: 8082

spring:
  application:
    name: festival-service
  datasource:
    url: jdbc:mysql://${FESTIVAL_DB_HOST:localhost}:${FESTIVAL_DB_PORT:3307}/${FESTIVAL_DB_NAME:festival_db}
    username: ${FESTIVAL_DB_USERNAME:festival_user}
    password: ${FESTIVAL_DB_PASSWORD:festival_password}
    hikari:
      # 기본값(10)대로면 서비스 4개만으로 MySQL max_connections를 다 써버린다 — 4개 서비스가
      # 각자 여유를 갖도록 5로 낮춘다(2026-09-08, payment-service 도입 후 커넥션 고갈 장애).
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      # 요청당 최대 3장 x 10MB. 파일당 제한은 max-file-size, 전체 요청 제한은 여유를 두고 잡는다.
      max-file-size: 10MB
      max-request-size: 35MB

# 페스티벌 배너·대표이미지 저장 경로. 운영 환경에서는 .env의 SAVED_IMAGE로 덮어쓴다.
festival:
  image:
    saved-path: ${SAVED_IMAGE:./savedimage}

# Festival-Service → Auth-Service 내부 호출(PUT /internal/v1/roles) 설정
# TODO: 실제 Bearer Token 계약(값·헤더 형식)은 Auth-Service 담당자와 합의 필요
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Festival-Service → Reservation-Service 내부 호출(POST /internal/v1/seats) 설정
reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}

internal:
  auth-token: ${INTERNAL_AUTH_TOKEN:CHANGE_ME_IN_ENV}
  auth-service:
    token: ${INTERNAL_AUTH_TOKEN:CHANGE_ME_IN_ENV}
  reservation-service:
    token: ${INTERNAL_RESERVATION_TOKEN:CHANGE_ME_IN_ENV}

app:
  timezone: ${APP_TIMEZONE:Asia/Seoul}

# AI 페스티벌 추천 챗봇(Google Gemini 무료 티어). 키는 .env의 GEMINI_API_KEY로만 주입하고 저장소에 두지 않는다.
# 모델은 일일 한도가 넉넉한 flash-lite 계열로 고정한다(이전에 flash 모델로 RPD를 금방 넘긴 이력).
gemini:
  api-key: ${GEMINI_API_KEY:CHANGE_ME_IN_ENV}
  model: ${GEMINI_MODEL:gemini-flash-lite-latest}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
