server:
  port: 8082

spring:
  application:
    name: festival-service
  datasource:
    url: jdbc:mysql://${FESTIVAL_DB_HOST:localhost}:${FESTIVAL_DB_PORT:3307}/${FESTIVAL_DB_NAME:festival_db}
    username: ${FESTIVAL_DB_USERNAME:festival_user}
    password: ${FESTIVAL_DB_PASSWORD:festival_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      # 요청당 최대 3장 x 10MB. 파일당 제한은 max-file-size, 전체 요청 제한은 여유를 두고 잡는다.
      max-file-size: 10MB
      max-request-size: 35MB

# 페스티벌 배너·대표이미지 저장 경로. 운영 환경에서는 .env의 SAVED_IMAGE로 덮어쓴다.
festival:
  image:
    saved-path: ${SAVED_IMAGE:./savedimage}

# Festival-Service → Auth-Service 내부 호출(PUT /internal/v1/roles) 설정
# TODO: 실제 Bearer Token 계약(값·헤더 형식)은 Auth-Service 담당자와 합의 필요
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

internal:
  auth-service:
    token: ${INTERNAL_AUTH_TOKEN:CHANGE_ME_IN_ENV}
