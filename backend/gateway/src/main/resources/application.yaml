server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: festival-service
          uri: http://localhost:8082
          predicates:
            - Path=/festivals/**,/reservations/**
