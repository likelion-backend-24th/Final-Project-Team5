server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: festival-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/festivals/**,/api/ticket-types/**
        - id: reservation-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/reservations/**
