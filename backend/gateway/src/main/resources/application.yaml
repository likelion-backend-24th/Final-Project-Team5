server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux: 
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: festival-service
              uri: ${FESTIVAL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/festivals/**,/api/ticket-types/**
            - id: host-applications
              uri: ${FESTIVAL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/host-applications/**
            - id: admin-host-applications
              uri: ${FESTIVAL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/admin/host-applications/**
            - id: host-festivals
              uri: ${FESTIVAL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/host/festivals/**
            - id: reservation-service
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/reservations/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments/**

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-please-change-before-deploy}
