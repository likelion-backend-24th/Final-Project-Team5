server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: festival-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/festivals/**,/api/ticket-types/**
            - id: host-applications
              uri: http://localhost:8082
              predicates:
                - Path=/api/host-applications/**
            - id: admin-host-applications
              uri: http://localhost:8082
              predicates:
                - Path=/api/admin/host-applications/**
            - id: host-festivals
              uri: http://localhost:8082
              predicates:
                - Path=/api/host/festivals/**
            - id: reservation-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/reservations/**
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payments/**

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-please-change-before-deploy}
