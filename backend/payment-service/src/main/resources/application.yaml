server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:3307}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_user}
    password: ${PAYMENT_DB_PASSWORD:payment_password}
    hikari:
      # 기본값(10)대로면 서비스 4개만으로 MySQL max_connections를 다 써버린다 — 4개 서비스가
      # 각자 여유를 갖도록 5로 낮춘다(2026-09-08, payment-service 도입 후 커넥션 고갈 장애).
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# paymentId 팀 접두사 — PortOne 요청·조회에 쓰는 결제 ID를 팀별로 구분한다.
payment:
  id-prefix: ${PAYMENT_ID_PREFIX:BE24-T05-}
  # 가상계좌 데모 자동 입금 — 테스트 채널만 쓰는 데모 사이트라 계좌 발급 후 delay-minutes가 지나면 입금된 것으로 처리한다.
  # 실결제로 전환하면 enabled=false로 꺼야 한다(실제 입금 없이 예매가 확정된다).
  demo-deposit:
    enabled: ${PAYMENT_DEMO_DEPOSIT_ENABLED:true}
    delay-minutes: ${PAYMENT_DEMO_DEPOSIT_DELAY_MINUTES:30}
    poll-ms: 60000

# PortOne V2 REST API 연동 설정. API Secret·Webhook Secret은 반드시 환경변수로만 주입한다.
portone:
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  store-id: ${PORTONE_STORE_ID:CHANGE_ME_IN_ENV}
  channel-key:
    payment: ${PORTONE_CHANNEL_KEY_PAYMENT:CHANGE_ME_IN_ENV}
    billing: ${PORTONE_CHANNEL_KEY_BILLING:CHANGE_ME_IN_ENV}
  api-secret: ${PORTONE_API_SECRET:CHANGE_ME_IN_ENV}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:CHANGE_ME_IN_ENV}

# Payment-Service → Reservation-Service 내부 호출(getReservationForPayment/confirm/cancel) 설정
reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}

festival-service:
  base-url: ${FESTIVAL_SERVICE_URL:http://localhost:8082}

auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

internal:
  auth-token: ${INTERNAL_AUTH_TOKEN:CHANGE_ME_IN_ENV}
