server:
  port: 8083

spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:mysql://${RESERVATION_DB_HOST:localhost}:${RESERVATION_DB_PORT:3307}/${RESERVATION_DB_NAME:reservation_db}
    username: ${RESERVATION_DB_USERNAME:reservation_user}
    password: ${RESERVATION_DB_PASSWORD:reservation_password}
    hikari:
      # 기본값(10)대로면 서비스 4개만으로 MySQL max_connections를 다 써버린다 — 4개 서비스가
      # 각자 여유를 갖도록 5로 낮춘다(2026-09-08, payment-service 도입 후 커넥션 고갈 장애).
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # expires_at·checked_in_at은 Instant(절대 시각)인데 컬럼은 타임존이 없는 DATETIME이라,
        # 변환 기준이 JVM 기본 타임존을 따라간다. 서버 시계를 KST로 바꾸면 UTC로 기록해둔 기존 행이
        # 9시간 어긋나게 읽히므로, 변환 기준을 UTC로 고정해 서버 타임존과 무관하게 만든다.
        jdbc:
          time_zone: UTC

festival-service:
  base-url: ${FESTIVAL_SERVICE_URL:http://localhost:8082}

# 호스트가 입력한 페스티벌 시각(타임존 없는 벽시계)을 "지금"과 비교할 때 쓰는 기준 타임존.
# 컨테이너 TZ 설정에 의존하지 않도록 명시한다 — 팀원 로컬·CI 등 TZ가 다른 환경에서도 같게 동작해야 한다.
app:
  timezone: ${APP_TIMEZONE:Asia/Seoul}

# 사이트 정책 점검 문서 6번 — 1인당(계정 기준) 티켓 종류당 구매 제한 기본값.
# 주최자가 티켓 종류별로 이 값보다 낮게 설정하는 기능은 festival-service에 아직 없다(후속 작업).
reservation:
  max-quantity-per-ticket-type: ${RESERVATION_MAX_QUANTITY_PER_TICKET_TYPE:4}

# 사이트 정책 점검 5번 환불 정책 팀 결정("기본적으로는 법률에 따름", "24시간 내는 환불 불가",
# 위약금은 플랫폼이 아니라 참가자에게서 떼지 않고 PG 수수료는 플랫폼 부담)을 옮긴 표.
# 구간별 수치는 공연 관람권 표준약관류 기준이며, 팀이 최신 수치를 확인하면 여기만 고치면 된다.
# daysBefore = 공연 시작까지 남은 일수가 이 값 이상일 때 feePercent를 적용.
refund:
  cutoff-hours: ${REFUND_CUTOFF_HOURS:24}
  tiers:
    - days-before: 10
      fee-percent: 0
    - days-before: 7
      fee-percent: 10
    - days-before: 3
      fee-percent: 20
    - days-before: 1
      fee-percent: 30

# Payment-Service → Reservation-Service 내부 호출(getReservationForPayment/confirm/cancel) 인증 토큰.
# payment-service·auth-service의 internal.auth-token/internal.role-grant.token과 반드시 같은 값이어야 한다.
internal:
  auth-token: ${INTERNAL_AUTH_TOKEN:CHANGE_ME_IN_ENV}

# 입장용 QR 이미지를 그려주는 외부 API(goqr.me / api.qrserver.com). 디코딩(read-qr-code)은 쓰지 않는다 —
# 스캔은 프론트에서 카메라로 직접 처리하고 결과 문자열(qrToken)만 서버로 전달받는다.
qr:
  image-base-url: ${QR_IMAGE_BASE_URL:https://api.qrserver.com/v1/create-qr-code/}
