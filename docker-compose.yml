services:
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME:-auth_db}
      MYSQL_USER: ${AUTH_DB_USERNAME:-auth_user}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${AUTH_DB_PORT:-3307}:3306"
    volumes:
      - auth-db-data:/var/lib/mysql

  festival-db:
    image: mysql:8.0
    container_name: festival-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${FESTIVAL_DB_NAME:-festival_db}
      MYSQL_USER: ${FESTIVAL_DB_USERNAME:-festival_user}
      MYSQL_PASSWORD: ${FESTIVAL_DB_PASSWORD:-festival_password}
      MYSQL_ROOT_PASSWORD: ${FESTIVAL_DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${FESTIVAL_DB_PORT:-3308}:3306"
    volumes:
      - festival-db-data:/var/lib/mysql

volumes:
  auth-db-data:
  festival-db-data:
