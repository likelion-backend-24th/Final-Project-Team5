services:
  core-db:
    image: mysql:8.0
    container_name: core-db
    restart: unless-stopped
    environment:
      # 다른 5개 서비스 컨테이너와 동일하게 KST로 맞춘다 — 이게 없으면 컨테이너 기본(UTC)을 따라가서
      # SELECT NOW()가 실제 시각보다 9시간 느리게 나온다.
      TZ: Asia/Seoul
      MYSQL_DATABASE: ${AUTH_DB_NAME:-auth_db}
      MYSQL_USER: ${AUTH_DB_USERNAME:-auth_user}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${AUTH_DB_PORT:-3307}:3306"
    volumes:
      - core-db-data:/var/lib/mysql
      - ./mysql-init/core-db:/docker-entrypoint-initdb.d:ro

  auth-service:
    build:
      context: ./backend/auth-service
    image: ghcr.io/likelion-backend-24th/final-project-team5-auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      # 호스트가 입력하는 페스티벌 시작·종료 시각은 타임존 없는 벽시계(KST)로 저장되는데, 컨테이너가
      # UTC로 돌면 LocalDateTime.now()와 9시간 어긋난다. 한국 대상 서비스이므로 서버 시계를 KST로 통일한다.
      TZ: Asia/Seoul
      AUTH_DB_HOST: core-db
      AUTH_DB_PORT: 3306
    depends_on:
      - core-db

  festival-service:
    build:
      context: ./backend/festival-service
    image: ghcr.io/likelion-backend-24th/final-project-team5-festival-service:latest
    container_name: festival-service
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      FESTIVAL_DB_HOST: core-db
      FESTIVAL_DB_PORT: 3306
      AUTH_SERVICE_URL: http://auth-service:8081
      # 행사 취소 승인 화면의 예상 환불 금액 조회(GET /internal/v1/payments/refund-preview) 대상.
      # .env의 PAYMENT_SERVICE_URL이 빈 값이라 여기서 덮어쓰지 않으면 호출이 항상 실패한다.
      PAYMENT_SERVICE_URL: http://payment-service:8084
      # 페스티벌 승인(PUBLISHED) 시 SEATED 티켓타입 좌석 생성을 요청하는 내부 호출 대상.
      # 이 값이 빠지면 코드 기본값(http://localhost:8083)으로 폴백돼 festival-service 컨테이너
      # 자기 자신을 가리키게 되고, 좌석 생성 호출이 항상 ConnectException으로 실패해
      # 페스티벌이 PUBLISH_PENDING에서 영원히 넘어가지 못한다(2026-09-18 확인된 장애).
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      # 컨테이너 내부 경로는 항상 이 절대경로로 고정한다(.env의 SAVED_IMAGE 값을 덮어씀).
      # 실제 저장 위치(호스트 쪽)는 아래 volumes 왼쪽 경로로 정한다 — 상대경로를 쓰면
      # docker compose가 호스트 쪽만 절대경로로 바꾸고 컨테이너 쪽은 그대로 둬서
      # "mount path must be absolute" 에러가 난다.
      SAVED_IMAGE: /app/savedimage
    # SAVED_IMAGE 경로를 볼륨으로 마운트하지 않으면 컨테이너를 재생성(배포)할 때마다
    # 업로드된 이미지가 전부 사라진다.
    volumes:
      - ${HOST_SAVED_IMAGE:-./backend/festival-service/savedimage}:/app/savedimage
    # reservation-service가 festival-service에 depends_on을 걸고 있어(부스 조회 등), 여기서
    # reservation-service를 depends_on에 추가하면 순환 의존이 생겨 배포 자체가 실패한다.
    # 시작 순서를 강제하는 대신 FestivalPublishRetryScheduler의 자동 재시도로 기동 순서 문제를 흡수한다.
    depends_on:
      - core-db
      - auth-service

  reservation-service:
    build:
      context: ./backend/reservation-service
    image: ghcr.io/likelion-backend-24th/final-project-team5-reservation-service:latest
    container_name: reservation-service
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      RESERVATION_DB_HOST: core-db
      RESERVATION_DB_PORT: 3306
      FESTIVAL_SERVICE_URL: http://festival-service:8082
    depends_on:
      - core-db
      - festival-service

  payment-service:
    build:
      context: ./backend/payment-service
    image: ghcr.io/likelion-backend-24th/final-project-team5-payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      PAYMENT_DB_HOST: core-db
      PAYMENT_DB_PORT: 3306
      AUTH_SERVICE_URL: http://auth-service:8081
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      FESTIVAL_SERVICE_URL: http://festival-service:8082
    depends_on:
      - core-db
      - reservation-service

  gateway:
    build:
      context: ./backend/gateway
    image: ghcr.io/likelion-backend-24th/final-project-team5-gateway:latest
    container_name: gateway
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      AUTH_SERVICE_URL: http://auth-service:8081
      FESTIVAL_SERVICE_URL: http://festival-service:8082
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - festival-service
      - reservation-service
      - payment-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://fevalgo.duckdns.org}
    image: ghcr.io/likelion-backend-24th/final-project-team5-frontend:latest
    container_name: frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gateway
      - frontend

volumes:
  core-db-data:
