# 초대 링크 원문은 요청/Referrer 로그에 기록하지 않는다.
map $request_uri $invitation_log_uri {
    ~^/helper-invite/ /helper-invite/REDACTED;
    ~^/api/auth/helper-invitations/ /api/auth/helper-invitations/REDACTED;
    default $uri;
}
log_format invitation_safe '$remote_addr [$time_local] "$request_method $invitation_log_uri $server_protocol" $status $body_bytes_sent';

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log invitation_safe;

    location ^~ /helper-invite/ {
        error_log /dev/null;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files /index.html =404;
    }

    # Vite 빌드 산출물은 파일명에 콘텐츠 해시가 붙어 나오므로(예: index-abc123.js),
    # 내용이 바뀌면 파일명 자체가 바뀐다 — 영구 캐싱해도 안전하다.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # /brand 파비콘, manifest, placeholder 이미지 등 — 해시가 없어 immutable은 아니지만
    # 자주 안 바뀌는 자산이라 짧게(7일)라도 캐싱해 재검증 왕복을 줄인다.
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|webmanifest|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 서비스워커 스크립트는 매번 재검증해야 브라우저가 갱신을 놓치지 않는다.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # index.html은 항상 최신 상태여야 새로 배포된 해시 자산을 참조할 수 있다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
