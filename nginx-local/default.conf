# 로컬 재현(docker-compose.local.yml) 전용 nginx 설정 — 운영 nginx/nginx.conf와 같은 경로 구성을 인증서 없이 HTTP로 제공한다.
# 운영 nginx는 ./nginx 폴더 전체를 불러오므로, 이 파일은 그 폴더에 두지 않는다(운영에 로컬 설정이 섞이지 않게).

map $request_uri $invitation_log_uri {
    ~^/helper-invite/ /helper-invite/REDACTED;
    ~^/api/auth/helper-invitations/ /api/auth/helper-invitations/REDACTED;
    default $uri;
}
log_format invitation_safe '$remote_addr [$time_local] "$request_method $invitation_log_uri $server_protocol" $status $body_bytes_sent';

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types application/json;

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log invitation_safe;

    # 화면과 API를 같은 출처(http://localhost:8088)로 제공한다. Host에 포트까지 넘겨야
    # 게이트웨이가 같은 출처 요청으로 보고 CORS 허용 목록(운영 도메인·Vite 5173)과 무관하게 처리한다.
    location ^~ /api/festivals/images/ {
        alias /var/www/savedimage/;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /api/booths/images/ {
        alias /var/www/savedimage/booths/;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        client_max_body_size 35M;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /ws {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $http_host;
    }
}
