# 초대 링크 원문은 요청/Referrer 로그에 기록하지 않는다.
map $request_uri $invitation_log_uri {
    ~^/helper-invite/ /helper-invite/REDACTED;
    ~^/api/auth/helper-invitations/ /api/auth/helper-invitations/REDACTED;
    default $uri;
}
log_format invitation_safe '$remote_addr [$time_local] "$request_method $invitation_log_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name fevalgo.duckdns.org;
    access_log /var/log/nginx/access.log invitation_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fevalgo.duckdns.org;
    access_log /var/log/nginx/access.log invitation_safe;

    ssl_certificate /etc/letsencrypt/live/fevalgo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fevalgo.duckdns.org/privkey.pem;

    location ^~ /api/auth/helper-invitations/ {
        error_log /dev/null;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }

    location ^~ /helper-invite/ {
        error_log /dev/null;
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        # 기본값 1MB로는 페스티벌 이미지 업로드(최대 3장 x 10MB)가 413으로 막힌다.
        # festival-service의 spring.servlet.multipart.max-request-size(35MB)와 맞춘다.
        client_max_body_size 35M;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # 실시간 구독 연결도 gateway로 보내 HTTP 업그레이드가 프론트 정적 서버에서 끊기지 않게 한다.
    location /ws {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
