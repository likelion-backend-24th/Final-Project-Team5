# 초대 링크 원문은 요청/Referrer 로그에 기록하지 않는다.
map $request_uri $invitation_log_uri {
    ~^/helper-invite/ /helper-invite/REDACTED;
    ~^/api/auth/helper-invitations/ /api/auth/helper-invitations/REDACTED;
    default $uri;
}
log_format invitation_safe '$remote_addr [$time_local] "$request_method $invitation_log_uri $server_protocol" $status $body_bytes_sent';

# API JSON 응답도 압축한다(홈 목록 약 114KB → 약 20KB). 프론트 정적 파일은 frontend 컨테이너가
# 이미 압축해서 보내므로 여기서 다시 압축하지 않는다.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types application/json;

server {
    listen 80;
    server_name fevalgo.duckdns.org;
    access_log /var/log/nginx/access.log invitation_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # 이미지·API 여러 개를 연결 하나로 동시에 받는다(HTTP/1.1은 연결당 한 번에 하나).
    http2 on;
    server_name fevalgo.duckdns.org;
    access_log /var/log/nginx/access.log invitation_safe;

    ssl_certificate /etc/letsencrypt/live/fevalgo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fevalgo.duckdns.org/privkey.pem;

    # 업로드 이미지는 gateway·festival-service(JVM)를 거치지 않고 nginx가 디스크에서 바로 준다.
    # 업로드 파일명은 UUID라 내용이 바뀌면 이름도 바뀌므로 7일 캐싱해도 안전하다.
    # 위장 파일이 같은 출처에서 스크립트로 해석되지 않도록 nosniff는 계속 붙인다.
    location ^~ /api/festivals/images/ {
        alias /var/www/savedimage/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /api/booths/images/ {
        alias /var/www/savedimage/booths/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /api/auth/helper-invitations/ {
        error_log /dev/null;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }

    location ^~ /helper-invite/ {
        error_log /dev/null;
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        # 기본값 1MB로는 페스티벌 이미지 업로드(최대 3장 x 10MB)가 413으로 막힌다.
        # festival-service의 spring.servlet.multipart.max-request-size(35MB)와 맞춘다.
        client_max_body_size 35M;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # 실시간 구독 연결도 gateway로 보내 HTTP 업그레이드가 프론트 정적 서버에서 끊기지 않게 한다.
    location /ws {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
