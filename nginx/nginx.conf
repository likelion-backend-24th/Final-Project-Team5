server {
    listen 80;
    server_name fevalgo.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fevalgo.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/fevalgo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fevalgo.duckdns.org/privkey.pem;

    location /api/ {
        # 기본값 1MB로는 페스티벌 이미지 업로드(최대 3장 x 10MB)가 413으로 막힌다.
        # festival-service의 spring.servlet.multipart.max-request-size(35MB)와 맞춘다.
        client_max_body_size 35M;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
